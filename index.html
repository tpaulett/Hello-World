<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plaid Integration Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      color: #1a1a1a;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #0a2540;
    }

    header p {
      color: #6b7280;
      margin-top: 6px;
      font-size: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 640px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      color: #0a2540;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2 .badge {
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 24px;
      transition: background 0.15s, opacity 0.15s;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #connectBtn {
      background: #0a2540;
      color: white;
      width: 100%;
    }

    #connectBtn:hover:not(:disabled) { background: #1a3a5c; }

    .mode-badge {
      background: #f0f7ff;
      border-left: 3px solid #0a2540;
      padding: 10px 12px;
      margin-bottom: 16px;
      border-radius: 4px;
      font-size: 12px;
      color: #0a2540;
    }

    .mode-badge strong { margin-right: 4px; }

    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab {
      background: #f0f4f8;
      color: #6b7280;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }

    .tab.active {
      background: #0a2540;
      color: white;
    }

    .tab:hover:not(.active) { background: #e0e7ef; }

    .account-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .account-item:last-child { border-bottom: none; }

    .account-name { font-weight: 500; font-size: 14px; }
    .account-meta { font-size: 12px; color: #9ca3af; margin-top: 2px; }

    .account-balance { text-align: right; }
    .balance-current { font-weight: 600; font-size: 15px; }
    .balance-available { font-size: 12px; color: #9ca3af; }

    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .tx-item:last-child { border-bottom: none; }

    .tx-name { font-size: 13px; font-weight: 500; }
    .tx-date { font-size: 11px; color: #9ca3af; margin-top: 2px; }

    .tx-amount {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .tx-amount.debit { color: #ef4444; }
    .tx-amount.credit { color: #22c55e; }

    .auth-item {
      background: #f8fafc;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .auth-item strong { display: block; font-size: 14px; margin-bottom: 6px; }
    .auth-item span { color: #6b7280; }

    .empty {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      padding: 24px 0;
    }

    .status {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
      margin-top: 10px;
      min-height: 20px;
    }

    .status.error { color: #ef4444; }
    .status.success { color: #22c55e; }

    #dataSection { display: none; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
    }

    .modal.show { display: flex; }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 28px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .modal h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #0a2540;
    }

    .modal-user {
      padding: 12px;
      margin-bottom: 8px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .modal-user:hover {
      border-color: #0a2540;
      background: #f0f7ff;
    }

    .modal-user-name { font-weight: 600; color: #0a2540; }
    .modal-user-desc { font-size: 12px; color: #6b7280; margin-top: 4px; }

    .modal-close {
      text-align: right;
      margin-top: 16px;
    }

    .modal-close button {
      background: #e5e7eb;
      color: #1f2937;
      padding: 8px 16px;
      font-size: 13px;
    }

    .modal-close button:hover { background: #d1d5db; }
  </style>
</head>
<body>

<header>
  <h1>Plaid Integration Demo</h1>
  <p>Connect a test bank account to view financial data</p>
</header>

<!-- Connect Card -->
<div class="card" id="connectCard">
  <h2>Connect a Bank Account</h2>
  <div class="mode-badge">
    <strong>Mode:</strong> 📚 Mock Data (No Backend Needed)
  </div>
  <button id="connectBtn">Connect with Plaid</button>
  <p class="status" id="connectStatus"></p>
</div>

<!-- Data Card -->
<div class="card" id="dataSection">
  <h2>Your Financial Data <span class="badge" id="institutionBadge"></span></h2>

  <div class="tab-bar">
    <button class="tab active" onclick="showTab('accounts')">Accounts</button>
    <button class="tab" onclick="showTab('transactions')">Transactions</button>
    <button class="tab" onclick="showTab('auth')">Routing Info</button>
  </div>

  <div id="accountsTab"></div>
  <div id="transactionsTab" style="display:none"></div>
  <div id="authTab" style="display:none"></div>
</div>

<!-- Modal for selecting test account -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Select a Test Account</h3>
    <div id="userList"></div>
    <div class="modal-close">
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

  let currentUser = null;

  document.getElementById('connectBtn').addEventListener('click', showModal);

  function showModal() {
    const modal = document.getElementById('modal');
    const userList = document.getElementById('userList');

    userList.innerHTML = Object.entries(mockData).map(([username, data]) => `
      <div class="modal-user" onclick="selectUser('${username}')">
        <div class="modal-user-name">${username}</div>
        <div class="modal-user-desc">
          ${data.institution} • ${data.accounts.length} account${data.accounts.length > 1 ? 's' : ''}
        </div>
      </div>
    `).join('');

    modal.classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  function selectUser(username) {
    currentUser = username;
    closeModal();

    const data = mockData[username];
    document.getElementById('connectCard').style.display = 'none';
    document.getElementById('dataSection').style.display = 'block';
    document.getElementById('institutionBadge').textContent = data.institution;

    loadAccounts();
    loadTransactions();
    loadAuth();
  }

  function loadAccounts() {
    const data = mockData[currentUser];
    const el = document.getElementById('accountsTab');

    el.innerHTML = data.accounts.map(a => `
      <div class="account-item">
        <div>
          <div class="account-name">${a.name}</div>
          <div class="account-meta">${a.official_name || ''} • ••••${a.mask}</div>
        </div>
        <div class="account-balance">
          <div class="balance-current">$${(a.balances.current ?? 0).toFixed(2)}</div>
          ${a.balances.available != null
            ? `<div class="balance-available">Available: $${a.balances.available.toFixed(2)}</div>`
            : ''}
        </div>
      </div>
    `).join('');
  }

  function loadTransactions() {
    const data = mockData[currentUser];
    const el = document.getElementById('transactionsTab');

    el.innerHTML = data.transactions.map(t => `
      <div class="tx-item">
        <div>
          <div class="tx-name">${t.merchant_name || t.name}</div>
          <div class="tx-date">${t.date}</div>
        </div>
        <div class="tx-amount ${t.amount > 0 ? 'debit' : 'credit'}">
          ${t.amount > 0 ? '-' : '+'}$${Math.abs(t.amount).toFixed(2)}
        </div>
      </div>
    `).join('');
  }

  function loadAuth() {
    const data = mockData[currentUser];
    const el = document.getElementById('authTab');

    el.innerHTML = data.auth.map(n => {
      const acct = data.accounts.find(a => a.account_id === n.account_id);
      return `
        <div class="auth-item">
          <strong>${acct?.name || 'Account'} (••••${acct?.mask || ''})</strong>
          <span>Routing: ${n.routing}</span><br/>
          <span>Account: ••••${n.account.slice(-4)}</span>
        </div>
      `;
    }).join('');
  }

  function showTab(name) {
    ['accounts', 'transactions', 'auth'].forEach(t => {
      document.getElementById(`${t}Tab`).style.display = t === name ? 'block' : 'none';
    });
    document.querySelectorAll('.tab').forEach((btn, i) => {
      btn.classList.toggle('active', ['accounts', 'transactions', 'auth'][i] === name);
    });
  }
